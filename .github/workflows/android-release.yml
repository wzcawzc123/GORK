name: Eta Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 准备签名（有 Secrets 用发布证书，否则临时自签）
        run: |
          if [[ -n "${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}" && \
                -n "${{ secrets.ETA_RELEASE_STORE_PASSWORD }}" && \
                -n "${{ secrets.ETA_RELEASE_KEY_ALIAS }}" && \
                -n "${{ secrets.ETA_RELEASE_KEY_PASSWORD }}" ]]; then
            printf '%s' "${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}" \
              | base64 --decode \
              > "$RUNNER_TEMP/eta-release.jks"
            echo "SIGN_MODE=secrets" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/eta-release.jks" \
              -alias eta -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass eta-release-pass -keypass eta-release-pass \
              -dname "CN=Eta Self-Signed, OU=Eta, O=Eta, L=CN, ST=CN, C=CN"
            echo "SIGN_MODE=self-signed" >> "$GITHUB_ENV"
            echo "::warning::未配置 Release 签名 Secrets，已使用临时自签证书构建（正式版为自签名，安装需允许未知来源）。"
          fi

      - name: 构建 Debug 与 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD || 'eta-release-pass' }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS || 'eta' }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD || 'eta-release-pass' }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleDebug :app:assembleRelease

      - name: 验证并整理 APK
        id: apk
        run: |
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"
          output_dir="$RUNNER_TEMP/apks"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ! -f "$debug_apk" ]]; then
            echo "::error::未找到 Debug APK。"
            exit 1
          fi
          if [[ ! -f "$release_apk" ]]; then
            echo "::error::未找到 Release APK。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          certs_output="$("$apksigner_path" verify --print-certs "$release_apk")"
          echo "$certs_output"

          # 签名钉扎校验：正式签名必须匹配固定证书指纹，防止签名漂移
          if [[ "$SIGN_MODE" == "secrets" ]]; then
            expected_sha256="465e1f705b29b420513ea72502e738a3996f8900c9a8c7631ffecb74c4d85824"
            actual_sha256="$(echo "$certs_output" | grep -iE 'SHA-256 digest' | head -n 1 | sed -E 's/.*: *//' | tr '[:upper:]' '[:lower:]')"
            if [[ -z "$actual_sha256" || "$actual_sha256" != "$expected_sha256" ]]; then
              echo "::error::签名钉扎校验失败：期望 $expected_sha256，实际 ${actual_sha256:-<未提取到>}。请检查 Release 签名 Secrets 是否被修改或过期。"
              exit 1
            fi
            echo "签名钉扎校验通过：$actual_sha256"
          else
            echo "::warning::自签模式跳过签名钉扎校验（正式版为自签名，仅供测试，安装需允许未知来源）"
          fi

          mkdir -p "$output_dir"
          cp "$debug_apk" "$output_dir/app-debug.apk"
          cp "$release_apk" "$output_dir/app-release.apk"
          echo "debug_path=$output_dir/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "release_path=$output_dir/app-release.apk" >> "$GITHUB_OUTPUT"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')"
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} 已存在，更新资产"
            gh release upload "${tag}" \
              "${{ steps.apk.outputs.release_path }}" \
              "${{ steps.apk.outputs.debug_path }}" --clobber
          else
            echo "创建 Release ${tag}"
            gh release create "${tag}" \
              "${{ steps.apk.outputs.release_path }}" \
              "${{ steps.apk.outputs.debug_path }}" \
              --title "${tag}" --generate-notes
          fi
